<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ремонт">
<meta name="theme-color" content="#1A3C5E">
<link rel="manifest" href="manifest.json">
<title>Список покупок — Ремонт</title>
<style>
:root {
  --bg:#F5F3EF; --card:#FFF; --primary:#1A3C5E; --accent:#E05C2A;
  --green:#2E8B6F; --text:#1C1C1C; --muted:#888; --border:#E0DDD7;
  --done-bg:#F0FAF5; --shadow:0 2px 12px rgba(0,0,0,0.07); --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px}

/* HEADER */
.hdr{background:var(--primary);color:#fff;padding:env(safe-area-inset-top,12px) 16px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.18)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding-top:8px;margin-bottom:10px}
.hdr h1{font-size:17px;font-weight:800;line-height:1.2}
.hdr h1 span{color:#F0A060}
.prog-wrap{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.prog-bar{flex:1;height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:#F0A060;border-radius:3px;transition:width .4s}
.prog-txt{font-size:11px;font-weight:700;opacity:.9;white-space:nowrap}

/* UPDATE BANNER */
.update-banner{display:none;background:#F0A060;color:#1A3C5E;padding:8px 16px;font-size:12px;font-weight:700;text-align:center;cursor:pointer}

/* TABS */
.tabs{display:flex;gap:6px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);border:2px solid transparent;transition:all .2s}
.tab.active{background:#fff;color:var(--primary)}

/* SUMMARY */
.summary{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.summary::-webkit-scrollbar{display:none}
.sc{background:#fff;border-radius:10px;padding:8px 12px;min-width:100px;box-shadow:var(--shadow);flex-shrink:0}
.sc .lbl{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.sc .val{font-size:15px;font-weight:800;color:var(--primary);margin-top:1px}
.sc .val.g{color:var(--green)} .sc .val.o{color:var(--accent)}

/* SECTION */
.section{padding:0 16px;margin-top:14px}
.sec-title{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin-bottom:7px;padding-left:3px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ITEM CARD */
.item{background:var(--card);border-radius:var(--r);margin-bottom:7px;box-shadow:var(--shadow);border:2px solid transparent;overflow:hidden;transition:all .2s}
.item.done{background:var(--done-bg);border-color:#A8DFC8;opacity:.82}

/* MAIN ROW */
.item-main{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;cursor:pointer;user-select:none}
.photo{width:52px;height:52px;border-radius:8px;flex-shrink:0;overflow:hidden;background:#F0EEE8;display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.photo img{width:100%;height:100%;object-fit:contain;padding:3px}
.no-img{font-size:20px}
.done .photo{filter:grayscale(60%);opacity:.7}
.info{flex:1;min-width:0}
.art{font-size:9px;font-weight:700;color:var(--primary);opacity:.7;letter-spacing:.4px;margin-bottom:1px}
.nm{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:2px}
.done .nm{text-decoration:line-through;color:var(--muted)}
.loc{font-size:10px;color:var(--muted);line-height:1.3}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.chk{width:26px;height:26px;border-radius:8px;border:2.5px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .2s;background:#fff}
.done .chk{background:var(--green);border-color:var(--green)}
.chk svg{display:none} .done .chk svg{display:block}
.qty-badge{background:var(--primary);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
.done .qty-badge{background:var(--green)}
.price-total{font-size:11px;font-weight:700;color:var(--accent)}
.done .price-total{color:var(--muted)}

/* EXPAND ROW */
.expand-row{border-top:1px solid var(--border);padding:7px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:11px;color:var(--primary);font-weight:600}
.done .expand-row{border-color:#A8DFC8}
.chev{transition:transform .2s;font-size:9px}
.expanded .chev{transform:rotate(180deg)}

/* DETAIL */
.detail{display:none;padding:0 12px 12px;background:#F8F9FB;border-top:1px solid var(--border)}
.detail.open{display:block}
.done .detail{background:#EDF7F3}
.big-photo{width:100%;max-height:150px;object-fit:contain;border-radius:8px;background:#F0EEE8;padding:6px;margin-bottom:8px;border:1px solid var(--border)}

/* EDITABLE PRICE */
.price-edit-wrap{margin:8px 0 4px;padding:8px;background:#fff;border-radius:8px;border:1.5px solid var(--border)}
.price-edit-wrap label{font-size:10px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.price-row{display:flex;align-items:center;gap:8px}
.price-input{flex:1;border:1.5px solid var(--border);border-radius:7px;padding:7px 10px;font-size:14px;font-weight:700;color:var(--primary);background:#F8F9FB;text-align:right;max-width:100px}
.price-input:focus{outline:none;border-color:var(--primary);background:#fff}
.price-currency{font-size:13px;font-weight:700;color:var(--muted)}
.price-kzt{font-size:11px;color:var(--green);font-weight:600;margin-top:3px}
.price-reset{font-size:10px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0}

.dr{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px}
.dr:last-child{border-bottom:none}
.dl{color:var(--muted);font-weight:500}
.dv{font-weight:600;color:var(--text);text-align:right;max-width:60%}
.dlink{color:#0563C1;text-decoration:none;font-weight:600;font-size:11px}

.note-wrap{margin-top:7px}
.note-wrap label{font-size:10px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.note-input{width:100%;border:1.5px solid var(--border);border-radius:7px;padding:7px 9px;font-size:12px;color:var(--text);background:#fff;resize:none;height:52px;font-family:inherit}
.note-input:focus{outline:none;border-color:var(--primary)}

/* BOTTOM BAR */
.bot{position:fixed;bottom:0;left:0;right:0;background:var(--primary);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.bot-lbl{font-size:11px;opacity:.7;font-weight:500}
.bot-amts{display:flex;gap:12px;align-items:center}
.bot-eur{font-size:13px;font-weight:700}
.bot-kzt{font-size:17px;font-weight:800;color:#F0A060}
</style>
</head>

// ── Persistent state (survives updates) ─────────────────────────────────
// Keys: checked_{article}, price_{article}, note_{article}
const S = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } },
  set: (k,v) => localStorage.setItem(k, JSON.stringify(v)),
};

function isChecked(article) { return !!S.get('chk_' + article); }
function getPrice(article, defaultPrice) {
  const v = S.get('price_' + article);
  return (v !== null && v !== undefined) ? parseFloat(v) : defaultPrice;
}
function getNote(article) { return S.get('note_' + article) || ''; }
function setChecked(article, v) { S.set('chk_' + article, v); }
function setPrice(article, v) { S.set('price_' + article, v); }
function setNote(article, v) { S.set('note_' + article, v); }

// ── Stats ─────────────────────────────────────────────────────────────
function allItems() { return CATALOG_DATA.flatMap(s => s.items); }

function updateStats() {
  const all = allItems();
  const total = all.length;
  const done  = all.filter(i => isChecked(i.article)).length;
  const budget = all.reduce((s,i) => s + i.qty * i.price, 0);
  const spent  = all.filter(i => isChecked(i.article))
                    .reduce((s,i) => s + i.qty * getPrice(i.article, i.price), 0);
  const remain = all.filter(i => !isChecked(i.article))
                    .reduce((s,i) => s + i.qty * getPrice(i.article, i.price), 0);

  document.getElementById('doneCount').textContent = done + '/' + total;
  document.getElementById('progFill').style.width  = (total ? done/total*100 : 0) + '%';
  document.getElementById('progTxt').textContent   = (total ? Math.round(done/total*100) : 0) + '%';
  document.getElementById('sTot').textContent    = total;
  document.getElementById('sBought').textContent = done;
  document.getElementById('sEur').textContent    = budget.toFixed(0) + ' €';
  document.getElementById('sSpent').textContent  = Math.round(spent * KZT).toLocaleString('ru') + ' ₸';
  document.getElementById('botRemain').textContent = (total - done) + ' позиций';
  document.getElementById('botEur').textContent    = remain.toFixed(0) + ' €';
  document.getElementById('botKzt').textContent    = Math.round(remain * KZT).toLocaleString('ru') + ' ₸';
}

// ── Render ────────────────────────────────────────────────────────────
let activeFilter = 'all';

function renderList(filter) {
  activeFilter = filter;
  const container = document.getElementById('list');
  container.innerHTML = '';

  CATALOG_DATA.forEach(section => {
    let items = section.items;
    if (filter === 'pending')   items = items.filter(i => !isChecked(i.article));
    if (filter === 'done')      items = items.filter(i =>  isChecked(i.article));
    if (['electrical','boxes','plumbing','bathroom'].includes(filter) && section.category !== filter) return;
    if (!items.length) return;

    const sec = document.createElement('div');
    sec.className = 'section';
    const st = document.createElement('div');
    st.className = 'sec-title';
    st.textContent = section.section;
    sec.appendChild(st);

    items.forEach(item => {
      const done  = isChecked(item.article);
      const price = getPrice(item.article, item.price);
      const lineEur = (item.qty * price).toFixed(0);
      const lineKzt = Math.round(item.qty * price * KZT).toLocaleString('ru');
      const note  = getNote(item.article);
      const thumb = item.img
        ? `<img src="${item.img}" alt="${item.article}" loading="lazy">`
        : `<span class="no-img">📦</span>`;
      const bigImg = item.img
        ? `<img src="${item.img}" alt="${item.article}" class="big-photo" loading="lazy">`
        : '';
      const linkHtml = item.url
        ? `<a class="dlink" href="${item.url}" target="_blank">🔗 Открыть страницу</a>`
        : '—';
      const kztUnit = Math.round(price * KZT).toLocaleString('ru');

      const card = document.createElement('div');
      card.className = 'item' + (done ? ' done' : '');
      card.innerHTML = `
        <div class="item-main" onclick="toggleCheck('${item.article}')">
          <div class="photo">${thumb}</div>
          <div class="info">
            <div class="art">${item.article}</div>
            <div class="nm">${item.name}</div>
            <div class="loc">${item.location}</div>
          </div>
          <div class="item-right">
            <div class="chk"><svg width="13" height="10" viewBox="0 0 14 11" fill="none"><path d="M1 5L5.5 9.5L13 1" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="qty-badge">${item.qty} шт</div>
            <div class="price-total">${lineEur} €</div>
          </div>
        </div>
        <div class="expand-row" onclick="toggleDetail('${item.article}', this)">
          <span>Подробнее · ${lineKzt} ₸</span>
          <span class="chev">▼</span>
        </div>
        <div class="detail" id="det-${item.article}">
          ${bigImg}
          <div class="price-edit-wrap">
            <label>Реальная цена (за единицу)</label>
            <div class="price-row">
              <input class="price-input" type="number" step="0.01" min="0"
                value="${price.toFixed(2)}"
                onchange="updatePrice('${item.article}', this.value, ${item.price})"
                oninput="liveKzt('${item.article}', this.value)"
                id="pi-${item.article}">
              <span class="price-currency">€</span>
            </div>
            <div class="price-kzt" id="pkzt-${item.article}">≈ ${kztUnit} ₸ / шт</div>
            ${price !== item.price ? `<button class="price-reset" onclick="resetPrice('${item.article}', ${item.price})">↩ Сбросить к ${item.price} €</button>` : ''}
          </div>
          <div class="dr"><span class="dl">Кол-во</span><span class="dv">${item.qty} шт.</span></div>
          <div class="dr"><span class="dl">Итого</span><span class="dv" id="dtot-${item.article}">${lineEur} € / ${lineKzt} ₸</span></div>
          <div class="dr"><span class="dl">Место установки</span><span class="dv">${item.location}</span></div>
          <div class="dr"><span class="dl">Страница товара</span><span class="dv">${linkHtml}</span></div>
          <div class="note-wrap">
            <label>Заметка (магазин, цена, дата)</label>
            <textarea class="note-input" placeholder="Напр: куплено в Метеор ИТ за 1 200 ₸..."
              onchange="setNote('${item.article}', this.value)">${note}</textarea>
          </div>
        </div>
      `;
      sec.appendChild(card);
    });
    container.appendChild(sec);
  });
  updateStats();
}

function toggleCheck(article) {
  setChecked(article, !isChecked(article));
  if (navigator.vibrate) navigator.vibrate(25);
  renderList(activeFilter);
}

function toggleDetail(article, el) {
  const det = document.getElementById('det-' + article);
  const open = det.classList.contains('open');
  det.classList.toggle('open', !open);
  el.closest('.item').classList.toggle('expanded', !open);
  el.querySelector('.chev').style.transform = open ? '' : 'rotate(180deg)';
}

function liveKzt(article, val) {
  const p = parseFloat(val) || 0;
  const el = document.getElementById('pkzt-' + article);
  if (el) el.textContent = '≈ ' + Math.round(p * KZT).toLocaleString('ru') + ' ₸ / шт';
}

function updatePrice(article, val, defaultPrice) {
  const p = parseFloat(val);
  if (isNaN(p) || p < 0) return;
  setPrice(article, p);
  // Update total display without full re-render
  const item = allItems().find(i => i.article === article);
  if (!item) return;
  const lineEur = (item.qty * p).toFixed(0);
  const lineKzt = Math.round(item.qty * p * KZT).toLocaleString('ru');
  const tot = document.getElementById('dtot-' + article);
  if (tot) tot.textContent = lineEur + ' € / ' + lineKzt + ' ₸';
  updateStats();
}

function resetPrice(article, defaultPrice) {
  setPrice(article, defaultPrice);
  renderList(activeFilter);
}

// ── Tabs ──────────────────────────────────────────────────────────────
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  renderList(tab.dataset.filter);
});

// ── Service Worker & Update Flow ──────────────────────────────────────
let newWorker;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          document.getElementById('updateBanner').style.display = 'block';
        }
      });
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    window.location.reload();
  });
}
function applyUpdate() {
  if (newWorker) newWorker.postMessage('SKIP_WAITING');
}

// ── Init ──────────────────────────────────────────────────────────────
renderList('all');
</script>
</body>
</html>
